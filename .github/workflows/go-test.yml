name: Go Test

# Trigger the workflow on every push and pull request
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

# No shared setup job, and no credentials.
#
# This repo went through Arematics/workflows' go-setup, which mints a GitHub App
# token so a build can fetch private Arematics modules. It has none: go.mod
# declares `module github.com/Arematics/go-tests` and not one Arematics
# dependency. The whole apparatus — the app token, the .netrc, the GOPRIVATE
# settings, the workspace artifact — was serving a need that does not exist
# here, and it was doing it badly: the shared workflow moved to the GitHub App
# months ago, this repo kept passing the old GH_PRIVATE_REPOSITORY secret, and a
# workflow_call whose arguments do not match its callee never starts. The last
# green run was 2026-07-21; every push since produced a red X with no jobs and
# no log, and nobody could have read what was wrong.
#
# A pipeline with no secret in it cannot leak one.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # `go mod download`, not `go mod tidy`. tidy rewrites go.mod and go.sum
      # from whatever the module proxy serves at that moment; download resolves
      # against the checked-in go.sum, which is the lock file this repo has.
      - name: Validate Dependencies
        run: go mod download

      - name: Verify Code
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...
